name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "mail.nice.us.kg"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "8277a2a8-d81a-4251-a638-002e82554dfc"

[[kv_namespaces]]
binding = "kv"
id = "1a8e4653057a460a9200a51e1b10aedf"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
analysis_cache = "false"
#orm_log = false
domain = ["nice.us.kg","nicm.cc.cd"]
admin = "mail@nice.us.kg"
jwt_secret = "e2wddqwf32ffefwf"


[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
